name: Ejecutar notebook
on: [push, pull_request, workflow_dispatch]
jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: |
          cp student-mat.csv partes/
          for f in *.ipynb partes/*.ipynb; do
            jupyter nbconvert --to notebook --execute "$f" --output-dir /tmp/salida || exit 1
          done
